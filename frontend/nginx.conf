map $uri $response_cache_control {
    default "no-store";
    ~^/media/dogs/ "public, max-age=31536000, immutable";
    ~^/(main|polyfills|styles|chunk)-.*\.(js|css)$ "public, max-age=31536000, immutable";
    ~*\.(svg|png|jpe?g|woff2)$ "public, max-age=86400";
}

log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80 default_server;
    server_name "";
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name huskytracking.com www.huskytracking.com localhost 127.0.0.1;
    server_tokens off;
    access_log /var/log/nginx/access.log safe;
    root /usr/share/nginx/html;
    client_max_body_size 256k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $response_cache_control always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
