map $uri $response_cache_control {
    default "no-store";
    ~^/media/dogs/ "public, max-age=31536000, immutable";
    ~^/(main|polyfills|styles|chunk)-.*\.(js|css)$ "public, max-age=31536000, immutable";
    ~*\.(svg|png|jpe?g|woff2)$ "public, max-age=86400";
}

# Empty keys are not accounted for: ordinary GET navigation and static assets are
# unaffected. All keys use the client address after the narrowly trusted real-IP hop.
map "$request_method:$uri" $contact_rate_key {
    default "";
    "POST:/api/v1/contact" $binary_remote_addr;
}

map "$request_method:$uri" $demo_rate_key {
    default "";
    "GET:/api/v1/demo/session" $binary_remote_addr;
    "POST:/api/v1/demo/reset" $binary_remote_addr;
}

map "$request_method:$uri" $team_generate_rate_key {
    default "";
    ~^POST:/api/v1/daily-plans/[^/]+/activities/[^/]+/teams/generate$ $binary_remote_addr;
}

map $request_method $mutation_rate_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
}

limit_req_zone $contact_rate_key zone=contact_per_client:10m rate=3r/m;
limit_req_zone $demo_rate_key zone=demo_per_client:10m rate=10r/m;
limit_req_zone $team_generate_rate_key zone=team_generate_per_client:10m rate=10r/m;
limit_req_zone $mutation_rate_key zone=mutations_per_client:10m rate=1r/s;

log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80 default_server;
    server_name "";
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name huskytracking.com www.huskytracking.com localhost 127.0.0.1;
    server_tokens off;
    include /etc/nginx/trusted-proxy.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    access_log /var/log/nginx/access.log safe;
    # Default Nginx error diagnostics can echo a full request URI (including query).
    # Statuses remain in the path-only access log; retain only critical site errors.
    error_log /var/log/nginx/error.log crit;
    root /usr/share/nginx/html;
    client_max_body_size 256k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $response_cache_control always;
    limit_req_status 429;

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"Too many requests"}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=contact_per_client burst=2 nodelay;
        limit_req zone=demo_per_client burst=6 nodelay;
        limit_req zone=team_generate_per_client burst=6 nodelay;
        limit_req zone=mutations_per_client burst=30 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
