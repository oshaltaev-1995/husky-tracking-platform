name: husky-tracking-platform

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-husky_tracking}
      POSTGRES_USER: ${POSTGRES_USER:-husky_tracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-husky_tracking_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://husky_tracking:husky_tracking_dev@db:5432/husky_tracking}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4300,http://localhost:8080}
      DEMO_SEASON_START: ${DEMO_SEASON_START:-2025-12-01}
      DEMO_SEASON_END: ${DEMO_SEASON_END:-2026-03-31}
      DEMO_REFERENCE_DATE: ${DEMO_REFERENCE_DATE:-2026-03-31}
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-true}
      CONTACT_DELIVERY_MODE: ${CONTACT_DELIVERY_MODE:-sink}
      CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_GROQ_FREE_ACCOUNT_CONFIRMED: ${AGENT_GROQ_FREE_ACCOUNT_CONFIRMED:-false}
      AGENT_GROQ_API_KEY: ${AGENT_GROQ_API_KEY:-}
      AGENT_OPENROUTER_API_KEY: ${AGENT_OPENROUTER_API_KEY:-}
      AGENT_GROQ_MODEL: ${AGENT_GROQ_MODEL:-openai/gpt-oss-20b}
      AGENT_OPENROUTER_MODEL: ${AGENT_OPENROUTER_MODEL:-particle-ai/particle-1:free}
      AGENT_MAX_HTTP_CALLS: ${AGENT_MAX_HTTP_CALLS:-6}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      AGENT_DEADLINE_SECONDS: ${AGENT_DEADLINE_SECONDS:-45}
      AGENT_HTTP_TIMEOUT_SECONDS: ${AGENT_HTTP_TIMEOUT_SECONDS:-12}
      AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-1024}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-8}
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8030}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm start -- --host 0.0.0.0 --poll 1000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-4300}:4200"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  frontend-node-modules:
